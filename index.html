<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi Emosi Hebat</title><style>body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#74ebd5,#acb6e5);margin:0;padding:20px}.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:16px}.top{display:flex;justify-content:space-between;flex-wrap:wrap}.bar{height:18px;background:#ddd;border-radius:10px;overflow:hidden}.fill{height:100%;width:0;background:#43a047}.btn{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:10px;background:#1976d2;color:#fff}.hidden{display:none}.badge{padding:15px;border:2px solid gold;border-radius:12px;background:#fff8e1;text-align:center}.shake{animation:shake .3s}@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-5px)}}#confetti{font-size:40px;text-align:center}</style></head><body><div class="container"><h1>🌟 Misi Emosi Hebat</h1><div class="top"><div>Skor: <span id=s>0</span></div><div>Nyawa: <span id=l>❤️❤️❤️</span></div><div>Masa: <span id=t>20</span>s</div></div><div class=bar><div class=fill id=p></div></div><h3 id=q></h3><div id=a></div><div id=f></div><div id=confetti></div><button id=n class='btn hidden'>Seterusnya</button><button id=r class='btn hidden'>Main Semula</button><h3>🏆 Leaderboard</h3><ol id=lb></ol></div><script>const qs=[['Gagal ujian. Tindakan terbaik?',['Anggap diri gagal','Berbincang dengan guru','Salahkan orang','Ponteng'],1],['Diejek di media sosial?',['Balas kasar','Sebar gosip','Sekat dan lapor','Pendam'],2],['Stres tugasan?',['Jadualkan kerja','Main game sehari','Buat tak tahu','Tidur'],0],['Rakan murung?',['Abaikan','Ejek','Tanya khabar','Sebar cerita'],2],['Marah?',['Jerit','Tarik nafas','Rosak barang','Pendam'],1],['Cemas pembentangan?',['Elak','Bersedia','Salahkan rakan','Ponteng'],1],['Rakan berjaya?',['Cemburu','Kritik','Tahniah','Gosip'],2],['Mesej menyedihkan?',['Percaya terus','Sebar','Berbincang','Marah'],2],['Amalan sihat?',['Tidur cukup','Berjaga','Abaikan diri','Pendam'],0],['Terlalu tertekan?',['Minta bantuan','Pendam','Asing diri','Salahkan'],0],['Rakan dibuli?',['Ketawa','Rakam','Lapor guru','Abaikan'],2],['Kecerdasan emosi?',['Urus emosi','Sentiasa marah','Tak peduli','Sembunyi'],0],['Kecewa?',['Bersenam','Pecah barang','Tengking','Tak makan'],0],['Rakan luah masalah?',['Dengar','Ejek','Abaikan','Sebar'],0],['Keseimbangan hidup?',['Belajar sahaja','Bahagi masa','Main tanpa had','Tiada rancangan'],1]];let i=0,score=0,lives=3,time=20,timer;const q=document.getElementById('q'),a=document.getElementById('a'),f=document.getElementById('f');function tone(fr,d){const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=fr;o.start();o.stop(c.currentTime+d);}function load(){clearInterval(timer);time=20;document.getElementById('t').textContent=time;timer=setInterval(()=>{time--;t.textContent=time;if(time<=0){wrong();}},1000);document.getElementById('p').style.width=((i/qs.length)*100)+'%';q.textContent='Soalan '+(i+1)+'/'+qs.length+': '+qs[i][0];a.innerHTML='';f.innerHTML='';document.getElementById('confetti').textContent='';qs[i][1].forEach((x,ix)=>{let b=document.createElement('button');b.className='btn';b.textContent=x;b.onclick=()=>ans(ix);a.appendChild(b);});}function ans(ix){clearInterval(timer);if(ix===qs[i][2]){score+=10;s.textContent=score;tone(700,.15);setTimeout(()=>tone(1000,.15),150);confetti.textContent='🎉🎊✨';f.innerHTML='✅ Betul';}else wrong(false);n.classList.remove('hidden');}function wrong(auto=true){clearInterval(timer);tone(250,.3);lives--;l.textContent='❤️'.repeat(lives);document.querySelector('.container').classList.add('shake');setTimeout(()=>document.querySelector('.container').classList.remove('shake'),300);f.innerHTML='❌ Cuba lagi.';if(lives<=0){end();return;}if(auto){n.classList.remove('hidden');}}n.onclick=()=>{i++;if(i<qs.length){n.classList.add('hidden');load();}else end();};function badge(){if(score===150)return '👑 Master Kesihatan Mental';if(score>=140)return '🏆 Juara Kesejahteraan Minda';if(score>=110)return '🥇 Wira Emosi';if(score>=80)return '🥈 Rakan Prihatin';if(score>=50)return '🥉 Penjelajah Emosi';return '🌱 Benih Kesejahteraan';}function end(){clearInterval(timer);q.innerHTML='Permainan Tamat';a.innerHTML='';document.getElementById('p').style.width='100%';let name=prompt('Masukkan nama murid','Murid')||'Murid';let b=badge();f.innerHTML='<div class=badge><h2>'+b+'</h2><h3>Skor '+score+'/150</h3><p>Sijil Digital</p><p>'+name+'</p><button class=btn onclick="window.print()">Cetak/Muat Turun PDF</button></div>';let lb=JSON.parse(localStorage.getItem('mental_lb')||'[]');lb.push({n:name,s:score});lb.sort((a,b)=>b.s-a.s);lb=lb.slice(0,10);localStorage.setItem('mental_lb',JSON.stringify(lb));showLB();r.classList.remove('hidden');n.classList.add('hidden');}function showLB(){let lb=JSON.parse(localStorage.getItem('mental_lb')||'[]');document.getElementById('lb').innerHTML=lb.map(x=>'<li>'+x.n+' - '+x.s+'</li>').join('');}r.onclick=()=>location.reload();showLB();load();</script></body></html>
